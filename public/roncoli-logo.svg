<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16" />
  <g transform="translate(25, 70)">
    <!-- R O N C -->
    <text x="15" y="110" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-style="italic" font-size="105" fill="#13479b" letter-spacing="-2">RONC</text>
    
    <!-- Bearing "O" -->
    <g transform="translate(325, 68)">
      <!-- Outer red circle -->
      <circle cx="34" cy="2" r="38" fill="none" stroke="#d62027" stroke-width="6"/>
      <!-- Inner track -->
      <circle cx="34" cy="2" r="28" fill="none" stroke="#d62027" stroke-width="2.5"/>
      <!-- Ball bearings -->
      <circle cx="34" cy="-18" r="6.5" fill="#d62027"/>
      <circle cx="48" cy="-12" r="6.5" fill="#d62027"/>
      <circle cx="54" cy="2" r="6.5" fill="#d62027"/>
      <circle cx="48" cy="16" r="6.5" fill="#d62027"/>
      <circle cx="34" cy="22" r="6.5" fill="#d62027"/>
      <circle cx="20" cy="16" r="6.5" fill="#d62027"/>
      <circle cx="14" cy="2" r="6.5" fill="#d62027"/>
      <circle cx="20" cy="-12" r="6.5" fill="#d62027"/>
      <!-- Center hub -->
      <circle cx="34" cy="2" r="10" fill="none" stroke="#d62027" stroke-width="4"/>
      <circle cx="34" cy="2" r="4" fill="#d62027"/>
    </g>

    <!-- L I -->
    <text x="395" y="110" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-style="italic" font-size="105" fill="#13479b" letter-spacing="-1">LI</text>
    
    <!-- Red underline -->
    <rect x="100" y="122" width="355" height="9" fill="#d62027" rx="3" />
    
    <!-- AUTO PEÇAS -->
    <text x="455" y="152" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="25" fill="#d62027" text-anchor="end" letter-spacing="3">AUTO PEÇAS</text>

    <!-- Vendas - Balcão -->
    <text x="235" y="235" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#13479b" text-anchor="middle" letter-spacing="0.5">Vendas - Balcão</text>
  </g>
</svg>
